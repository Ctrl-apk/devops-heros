name: TaskBoard Python CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: 1. Test Quality Gate (Pytest & Frontend Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

  build-scan-push:
    name: 2. Build, Trivy Security Scan & Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Owner
        run: |
          echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ env.OWNER_LOWER }}/taskboard-backend:${{ github.sha }} \
            -t ghcr.io/${{ env.OWNER_LOWER }}/taskboard-backend:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/${{ env.OWNER_LOWER }}/taskboard-frontend:${{ github.sha }} \
            -t ghcr.io/${{ env.OWNER_LOWER }}/taskboard-frontend:latest \
            ./frontend

      - name: Scan backend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.OWNER_LOWER }}/taskboard-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan frontend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.OWNER_LOWER }}/taskboard-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Push images to GHCR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker push ghcr.io/${{ env.OWNER_LOWER }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER_LOWER }}/taskboard-backend:latest
          docker push ghcr.io/${{ env.OWNER_LOWER }}/taskboard-frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER_LOWER }}/taskboard-frontend:latest

  deploy:
    name: 3. Helm Deployment to Kubernetes
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Owner
        run: |
          echo "OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Check Kubernetes credentials
        id: kubecheck
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG_DATA }}" ]; then
            echo "has_kube=true" >> $GITHUB_OUTPUT
          else
            echo "has_kube=false" >> $GITHUB_OUTPUT
            echo "::notice ::KUBE_CONFIG_DATA secret is not configured; skipping in-cluster Helm deploy."
          fi

      - name: Set up Helm
        if: steps.kubecheck.outputs.has_kube == 'true'
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        if: steps.kubecheck.outputs.has_kube == 'true'
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config

      - name: Deploy with Helm
        if: steps.kubecheck.outputs.has_kube == 'true'
        run: |
          helm upgrade --install taskboard ./helm/taskboard \
            -n taskboard \
            --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ env.OWNER_LOWER }}/taskboard-backend \
            --set frontend.image=ghcr.io/${{ env.OWNER_LOWER }}/taskboard-frontend
