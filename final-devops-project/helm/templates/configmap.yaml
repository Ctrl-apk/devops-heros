apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "final-devops-chart.fullname" . }}-config
  labels:
    {{- include "final-devops-chart.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.env.APP_ENV | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
