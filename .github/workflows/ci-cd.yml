name: TaskBoard DevOps CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: 1. Automated Tests & Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        working-directory: final-devops-project/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: final-devops-project/backend
        run: pytest -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React Frontend
        working-directory: final-devops-project/frontend
        run: |
          npm install
          npm run build

  build-scan-push:
    name: 2. Container Build, Trivy Security Scan & GHCR Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Container Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/taskboard-backend:latest \
            ./final-devops-project/backend

      - name: Build Frontend Container Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/taskboard-frontend:latest \
            ./final-devops-project/frontend

      - name: DevSecOps - Trivy Scan Backend Image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: DevSecOps - Trivy Scan Frontend Image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push Container Images to GHCR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-backend:latest
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/taskboard-frontend:latest

  deploy:
    name: 3. Continuous Deployment to Kubernetes via Helm
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        if: env.KUBE_CONFIG_DATA != ''
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config

      - name: Deploy TaskBoard with Helm
        if: env.KUBE_CONFIG_DATA != ''
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          helm upgrade --install taskboard ./final-devops-project/helm/taskboard \
            --namespace taskboard \
            --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ github.repository_owner }}/taskboard-backend \
            --set frontend.image=ghcr.io/${{ github.repository_owner }}/taskboard-frontend
