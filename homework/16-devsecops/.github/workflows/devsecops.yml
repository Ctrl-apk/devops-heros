name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: 1. Secret Scanning (TruffleHog / Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 2. SAST Scanning (Bandit)
      run: |
        pip install bandit
        bandit -r app/ -f txt

    - name: 3. SCA Dependency Scanning (Safety / Trivy)
      run: |
        pip install safety
        safety check -r requirements.txt

    - name: 4. Build Docker Image
      run: |
        docker build -t devsecops-app:${{ github.sha }} .

    - name: 5. Container Image Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devsecops-app:${{ github.sha }}'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

    - name: 6. Security Gate Validation
      run: |
        echo "All security checks (Secret Scan, SAST, SCA, Image Scan) passed successfully!"

  deploy:
    needs: security-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy Manifests to Kubernetes Cluster
      run: |
        echo "Applying manifests from k8s/deployment.yaml..."
        echo "DevSecOps Kubernetes deployment complete."
